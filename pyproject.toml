[project]
name = "Search_agent"

version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harika", email = "harikaannapareddy416@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "ipykernel>=7.4.0",
    "ipython>=9.17.1",
    "isort>=9.0.2",
    "langchain>=1.4.4",
    "langchain-core>=1.6.9",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.0",
